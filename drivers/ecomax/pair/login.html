<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ecoNET24 Login</title>
</head>

<body>
  <h2>Logga in på ecoNET24</h2>

  <label for="username">Användarnamn</label><br>
  <input id="username" type="text" autocomplete="username"><br><br>

  <label for="password">Lösenord</label><br>
  <input id="password" type="password" autocomplete="current-password"><br><br>

  <label for="uid">Device UID</label><br>
  <input id="uid" type="text"><br><br>

  <button id="continueButton" type="button">Fortsätt</button>

  <script>
    Homey.ready();

    document
      .getElementById('continueButton')
      .addEventListener('click', async () => {
        const credentials = {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
          uid: document.getElementById('uid').value.trim()
        };

        if (!credentials.username || !credentials.password || !credentials.uid) {
          Homey.alert('Fyll i användarnamn, lösenord och Device UID.');
          return;
        }

        try {
          await Homey.emit('login', credentials);
          Homey.nextView();
        } catch (error) {
          Homey.alert(error?.message || String(error));
        }
      });
  </script>
</body>
</html>
